name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release eligibility rules
        run: python3 .github/tests/test_release.py
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo test --manifest-path native/Cargo.toml --locked
      - run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings

  android:
    name: Android build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native -> target
          shared-key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Build JNI libraries for the vehicle and emulator
        run: ./scripts/build-native.sh arm64-v8a x86_64
      - name: Verify optimized release build
        run: ./gradlew assembleRelease lintRelease --console=plain
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run Android regression checks
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 28
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1920x720
          script: ANDROID_SERIAL=emulator-5554 ./scripts/test-android.sh
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-checks
          path: |
            app/build/reports/
            artifacts/android-smoke.txt
          if-no-files-found: ignore
          retention-days: 7
