name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Sign and publish merged changes
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
    steps:
      - name: Select an unreleased merge at the current main commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [[ "$head" != "$SOURCE_SHA" ]]; then
            echo 'Skipping a superseded commit.'
            exit 0
          fi
          merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
          if [[ "$merged" == 0 ]]; then
            echo 'Skipping a direct push: automatic releases require a merged PR.'
            exit 0
          fi
          version="0.1.$CI_RUN_NUMBER"
          tag="v$version"
          if existing=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish 2>/dev/null); then
            if [[ $(jq -r '.isDraft' <<< "$existing") == false ]]; then
              echo 'This CI run already has a published release.'
              exit 0
            fi
            if [[ $(jq -r '.targetCommitish' <<< "$existing") != "$SOURCE_SHA" ]]; then
              echo 'The existing draft targets a different commit.' >&2
              exit 1
            fi
          fi
          {
            echo "name=$version"
            echo "tag=$tag"
            echo "code=$((CI_RUN_NUMBER + 1))"
            echo 'publish=true'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.version.outputs.publish == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.version.outputs.publish == 'true'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.version.outputs.publish == 'true'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        if: steps.version.outputs.publish == 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.version.outputs.publish == 'true'
        with:
          workspaces: native -> target
          shared-key: android
      - name: Build unsigned release
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          RELEASE_CODE: ${{ steps.version.outputs.code }}
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          ./scripts/build-native.sh
          ./gradlew assembleRelease lintRelease --console=plain \
            -PappVersionName="$RELEASE_VERSION" -PappVersionCode="$RELEASE_CODE"
      - name: Sign and verify APK
        if: steps.version.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export KEYSTORE_FILE="$RUNNER_TEMP/impulsefy-release.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ("ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"):
              if not os.environ.get(name):
                  raise SystemExit(f"Missing Actions secret: {name}")
          os.umask(0o077)
          Path(os.environ["KEYSTORE_FILE"]).write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True))
          PY
          mkdir -p artifacts
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" sign --ks "$KEYSTORE_FILE" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out artifacts/impulsefy.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$signer" verify --verbose --print-certs artifacts/impulsefy.apk
          (cd artifacts && sha256sum impulsefy.apk > impulsefy.apk.sha256)
      - name: Publish APK with generated changelog
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [[ "$head" != "$SOURCE_SHA" ]]; then
            echo 'A newer merge is available; its successful CI run will release it.'
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/impulsefy.apk artifacts/impulsefy.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/impulsefy.apk artifacts/impulsefy.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "Impulsefy $RELEASE_TAG" --generate-notes --draft
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
