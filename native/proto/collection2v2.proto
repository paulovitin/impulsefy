// Collection v2 wire schema, subset of librespot-protocol 0.8.0 (MIT).
// Upstream ships this schema but does not generate/export its Rust module.
syntax = "proto3";
package spotify.collection.proto.v2;

message CollectionItem {
    string uri = 1;
    int32 added_at = 2;
    bool is_removed = 3;
    optional string context_uri = 4;
}

message PageRequest {
    string username = 1;
    string set = 2;
    string pagination_token = 3;
    int32 limit = 4;
}

message PageResponse {
    repeated CollectionItem items = 1;
    string next_page_token = 2;
    string sync_token = 3;
}

message WriteRequest {
    string username = 1;
    string set = 2;
    repeated CollectionItem items = 3;
    string client_update_id = 4;
}
