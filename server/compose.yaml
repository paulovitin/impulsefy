services:
  relay:
    build: .
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to your HTTPS origin}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      PORT: 8787
    restart: unless-stopped
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
