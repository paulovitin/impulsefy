services:
  relay:
    build: .
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to your HTTPS origin}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      BROWSER_LOGIN: ${BROWSER_LOGIN:-1}
      PORT: 8787
    restart: unless-stopped
    read_only: true
    init: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    shm_size: 256m
    mem_limit: 2g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./chromium-seccomp.json
  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
